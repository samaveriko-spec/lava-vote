<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Три стихии рефлексии</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d12;
    color: #eee;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 30px 20px;
  }
  h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 10px; font-size: 28px; }
  .subtitle { color: #888; margin-bottom: 30px; font-size: 15px; }

  .stage {
    display: flex;
    gap: 40px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .lamp-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  canvas {
    display: block;
    background: #1a1a22;
    border-radius: 90px;
    box-shadow: 0 0 60px rgba(255,255,255,0.04), inset 0 0 30px rgba(0,0,0,0.6);
  }

  .label {
    font-size: 14px;
    color: #aaa;
    text-align: center;
    max-width: 180px;
    line-height: 1.35;
  }

  .count {
    font-size: 26px;
    font-weight: 600;
    color: #fff;
  }

  .fill {
    font-size: 12px;
    color: #777;
  }

  .controls {
    margin-top: 40px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    padding: 14px 24px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  button:active { transform: scale(0.95); }
  button:hover { box-shadow: 0 0 22px currentColor; }

  .btn-wow { background: #ff3d7f; }
  .btn-think { background: #5b6dff; }
  .btn-know { background: #2fd9a5; }
  .btn-reset { background: #444; margin-top: 30px; font-size: 12px; padding: 8px 16px; }

  .leader {
    margin-top: 24px;
    font-size: 15px;
    color: #888;
  }

  /* ---------- Fullscreen ---------- */
  #fsBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    padding: 10px 16px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    z-index: 999;
    opacity: 0.15;
    transition: opacity 0.3s, background 0.2s;
  }
  #fsBtn:hover { opacity: 1; background: #333; }

  :fullscreen { cursor: none; }
  :fullscreen #fsBtn { cursor: pointer; opacity: 0.15; }
  :fullscreen #fsBtn:hover { opacity: 1; }
</style>
</head>
<body>

<button id="fsBtn" onclick="toggleFullscreen()">⛶ На весь экран</button>

<h1>Три стихии рефлексии</h1>
<div class="subtitle">Каждый голос — пузырёк. Сосуд заполняется и больше не пустеет</div>

<div class="stage">
  <div class="lamp-wrap">
    <canvas id="lamp0"></canvas>
    <div class="count" id="count0">0</div>
    <div class="fill" id="fill0">0%</div>
    <div class="label">Вау-эффект</div>
  </div>
  <div class="lamp-wrap">
    <canvas id="lamp1"></canvas>
    <div class="count" id="count1">0</div>
    <div class="fill" id="fill1">0%</div>
    <div class="label">Есть над чем подумать</div>
  </div>
  <div class="lamp-wrap">
    <canvas id="lamp2"></canvas>
    <div class="count" id="count2">0</div>
    <div class="fill" id="fill2">0%</div>
    <div class="label">Я это знаю</div>
  </div>
</div>

<div class="controls">
  <button class="btn-wow" onclick="vote(0)">🤯 Вау-эффект</button>
  <button class="btn-think" onclick="vote(1)">🤔 Есть над чем подумать</button>
  <button class="btn-know" onclick="vote(2)">🧐 Я это знаю</button>
</div>

<button class="btn-reset" onclick="resetVotes()">Сбросить все голоса (для админа)</button>

<div class="leader" id="leader">Загрузка данных...</div>

<!-- ПОДКЛЮЧАЕМ FIREBASE (Ваши ключи уже вставлены) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCxBIU7KjYPWx_gKC2KuFr5fJDGelPqrWQ",
    authDomain: "lava-vote.firebaseapp.com",
    databaseURL: "https://lava-vote-default-rtdb.firebaseio.com",
    projectId: "lava-vote",
    storageBucket: "lava-vote.firebasestorage.app",
    messagingSenderId: "250923521698",
    appId: "1:250923521698:web:3a9c0b4707c7165e3869fb"
  };

  // Инициализация Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const votesRef = ref(db, 'votes');

  // --- Логика ламп ---
  const LAMP_CONFIG = [
    { color: '#ff3d7f', glow: 'rgba(255,61,127,0.6)' },
    { color: '#5b6dff', glow: 'rgba(91,109,255,0.6)' },
    { color: '#2fd9a5', glow: 'rgba(47,217,165,0.6)' }
  ];

  const W = 180;
  const H = 500;
  let VOTES = [0, 0, 0];
  const MAX_BUBBLES = 40;

  class LavaLamp {
    constructor(canvas, config) {
      this.canvas = canvas;
      canvas.width = W;
      canvas.height = H;
      this.ctx = canvas.getContext('2d');
      this.w = W;
      this.h = H;
      this.color = config.color;
      this.glow = config.glow;
      this.bubbles = [];
      this.targetCount = 0;
      this.spawnTimer = 0;
      this.t = 0;
      this.topY = 100;
      this.bottomY = H - 100;
      this.leftX = 32;
      this.rightX = W - 32;
      this.baseVy = -0.55;
      this.baseRadius = 12;
    }

    setVotes(n) {
      this.targetCount = Math.min(MAX_BUBBLES, n);
    }

    get bubbleRadius() {
      const scale = Math.min(1, 20 / Math.max(1, this.targetCount));
      return this.baseRadius * (0.7 + 0.3 * scale);
    }

    spawnBubble() {
      const r = this.bubbleRadius;
      const margin = r + 4;
      const x = this.leftX + margin + Math.random() * (this.rightX - this.leftX - margin * 2);
      this.bubbles.push({
        x, y: this.bottomY - Math.random() * 20,
        r, targetR: r, currentR: 0.5,
        vy: this.baseVy * (0.85 + Math.random() * 0.3),
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.008 + Math.random() * 0.012,
        wobbleAmp: 2 + Math.random() * 3,
        age: 0, birthDuration: 220, settled: false
      });
    }

    update(dt) {
      this.t += dt;
      if (this.bubbles.length < this.targetCount) {
        this.spawnTimer -= dt;
        if (this.spawnTimer <= 0) {
          this.spawnBubble();
          this.spawnTimer = 120;
        }
      }
      for (const b of this.bubbles) {
        if (b.age < b.birthDuration) {
          b.age += dt;
          const k = Math.min(1, b.age / b.birthDuration);
          b.currentR = b.targetR * (1 - Math.pow(1 - k, 3));
        } else {
          b.currentR = b.targetR;
        }
        if (!b.settled) {
          b.y += b.vy * dt * 0.06;
          b.wobble += b.wobbleSpeed;
          b.x = b.x + Math.sin(b.wobble) * b.wobbleAmp * 0.02;
          if (b.x - b.currentR < this.leftX + 2) b.x = this.leftX + 2 + b.currentR;
          if (b.x + b.currentR > this.rightX - 2) b.x = this.rightX - 2 - b.currentR;
          if (b.y - b.currentR <= this.topY + 5) {
            b.y = this.topY + 5 + b.currentR;
            b.settled = true;
          }
        } else {
          b.wobble += 0.01;
          b.x += Math.sin(b.wobble) * 0.05;
        }
      }
      this.resolveSettled();
    }

    resolveSettled() {
      const settled = this.bubbles.filter(b => b.settled);
      settled.sort((a, b) => b.y - a.y);
      for (let i = 0; i < settled.length; i++) {
        const a = settled[i];
        for (let j = i + 1; j < settled.length; j++) {
          const b = settled[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = a.currentR + b.currentR + 1;
          if (dist < minDist && dist > 0.001) {
            const push = (minDist - dist) / 2;
            const ux = dx / dist;
            const uy = dy / dist;
            b.x += ux * push; b.y += uy * push;
            a.x -= ux * push; a.y -= uy * push;
          }
        }
      }
      for (const b of settled) {
        if (b.x - b.currentR < this.leftX + 2) b.x = this.leftX + 2 + b.currentR;
        if (b.x + b.currentR > this.rightX - 2) b.x = this.rightX - 2 - b.currentR;
        if (b.y - b.currentR < this.topY + 4) b.y = this.topY + 4 + b.currentR;
        if (b.y + b.currentR > this.bottomY) b.y = this.bottomY - b.currentR;
      }
    }

    draw() {
      const ctx = this.ctx;
      ctx.clearRect(0, 0, this.w, this.h);
      const bodyGrad = ctx.createLinearGradient(0, 0, this.w, 0);
      bodyGrad.addColorStop(0, '#4a4a55');
      bodyGrad.addColorStop(0.5, '#c8c8d0');
      bodyGrad.addColorStop(1, '#4a4a55');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.moveTo(16, this.h); ctx.lineTo(this.w - 16, this.h);
      ctx.lineTo(this.w - 36, this.h - 100); ctx.lineTo(36, this.h - 100);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(36, this.topY); ctx.lineTo(this.w - 36, this.topY);
      ctx.quadraticCurveTo(this.w / 2, -16, this.w / 2, 0);
      ctx.closePath(); ctx.fill();
      const glassGrad = ctx.createLinearGradient(0, this.topY, 0, this.bottomY);
      glassGrad.addColorStop(0, this.hexToRgba(this.color, 0.10));
      glassGrad.addColorStop(0.5, this.hexToRgba(this.color, 0.35));
      glassGrad.addColorStop(1, this.hexToRgba(this.color, 0.55));
      ctx.fillStyle = glassGrad;
      ctx.fillRect(this.leftX, this.topY, this.rightX - this.leftX, this.bottomY - this.topY);
      const fillRatio = this.bubbles.length / MAX_BUBBLES;
      ctx.save();
      ctx.shadowColor = this.glow;
      ctx.shadowBlur = 25 + fillRatio * 50;
      ctx.fillStyle = this.hexToRgba(this.color, 0.15 + fillRatio * 0.35);
      ctx.fillRect(this.leftX, this.topY, this.rightX - this.leftX, this.bottomY - this.topY);
      ctx.restore();
      for (const b of this.bubbles) {
        const r = b.currentR;
        if (r <= 0) continue;
        ctx.save();
        ctx.shadowColor = this.hexToRgba(this.color, 0.9);
        ctx.shadowBlur = 8;
        const grad = ctx.createRadialGradient(b.x - r * 0.35, b.y - r * 0.35, r * 0.1, b.x, b.y, r);
        grad.addColorStop(0, this.hexToRgba(this.color, 0.98));
        grad.addColorStop(0.55, this.hexToRgba(this.color, 0.7));
        grad.addColorStop(1, this.hexToRgba(this.color, 0.25));
        ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
        ctx.fillStyle = grad; ctx.fill();
        ctx.restore();
        ctx.beginPath(); ctx.arc(b.x - r * 0.3, b.y - r * 0.3, r * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
      }
      const shine = ctx.createLinearGradient(this.leftX + 5, 0, this.leftX + 30, 0);
      shine.addColorStop(0, 'rgba(255,255,255,0.0)');
      shine.addColorStop(0.5, 'rgba(255,255,255,0.22)');
      shine.addColorStop(1, 'rgba(255,255,255,0.0)');
      ctx.fillStyle = shine;
      ctx.fillRect(this.leftX + 5, this.topY, 25, this.bottomY - this.topY);
    }
    hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }
  }

  const lamps = LAMP_CONFIG.map((cfg, i) => {
    const canvas = document.getElementById('lamp' + i);
    return new LavaLamp(canvas, cfg);
  });

  // --- СВЯЗЬ С БАЗОЙ ДАННЫХ ---
  onValue(votesRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      VOTES = [data.v0 || 0, data.v1 || 0, data.v2 || 0];
      updateUI();
    } else {
      // Если базы нет (первый запуск), создаем нули
      resetVotes();
    }
  });

  window.vote = function(index) {
    runTransaction(ref(db, 'votes/v' + index), (currentValue) => {
      return (currentValue || 0) + 1;
    });
  };

  window.resetVotes = function() {
    if(confirm("Вы уверены, что хотите сбросить ВСЕ голоса?")) {
      set(votesRef, { v0: 0, v1: 0, v2: 0 });
    }
  };

  function updateUI() {
    for (let i = 0; i < 3; i++) {
      document.getElementById('count' + i).textContent = VOTES[i];
      lamps[i].setVotes(VOTES[i]);
      const pct = Math.round(Math.min(100, (VOTES[i] / MAX_BUBBLES) * 100));
      document.getElementById('fill' + i).textContent = `заполнено ${pct}%`;
    }
    updateLeader();
  }

  function updateLeader() {
    const total = VOTES.reduce((a, b) => a + b, 0);
    const leaderEl = document.getElementById('leader');
    if (total === 0) {
      leaderEl.textContent = 'Пока никто не голосовал';
      return;
    }
    const max = Math.max(...VOTES);
    const winners = VOTES.map((v, i) => v === max ? i : -1).filter(i => i >= 0);
    const names = ['Вау-эффект', 'Есть над чем подумать', 'Я это знаю'];
    if (winners.length === 3) {
      leaderEl.textContent = `Голосов: ${total}. Аудитория разделилась поровну!`;
    } else if (winners.length > 1) {
      leaderEl.textContent = `Голосов: ${total}. Лидируют: ${winners.map(i => names[i]).join(' и ')}`;
    } else {
      leaderEl.textContent = `Голосов: ${total}. Лидер: ${names[winners[0]]}`;
    }
  }

  // --- Анимация ---
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(50, now - last);
    last = now;
    for (const lamp of lamps) {
      lamp.update(dt);
      lamp.draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // --- Fullscreen ---
  window.toggleFullscreen = function() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => console.warn(err));
    } else {
      document.exitFullscreen();
    }
  };
  document.addEventListener('fullscreenchange', () => {
    const btn = document.getElementById('fsBtn');
    btn.textContent = document.fullscreenElement ? '⛶ Выйти' : '⛶ На весь экран';
  });
</script>
</body>
</html>
